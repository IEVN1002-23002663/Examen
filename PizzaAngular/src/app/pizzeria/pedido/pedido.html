
<div class="min-h-screen bg-slate-100 p-6">

  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-8">

    <h1 class="text-3xl font-bold text-slate-800 mb-2">
      Pizzería - Registro de pedidos
    </h1>

    <p class="text-gray-500 mb-8">
      Captura los datos del cliente y selecciona las pizzas.
    </p>

    <form [formGroup]="formulario" (ngSubmit)="agregarPizza()">

      <h2 class="text-xl font-semibold mb-4">
        Datos del cliente
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">

        <div>
          <label class="block mb-2 font-medium">Nombre completo</label>
          <input type="text" formControlName="nombre"
            class="w-full border border-gray-300 rounded-lg p-3">
        </div>

        <div>
          <label class="block mb-2 font-medium">Dirección</label>
          <input type="text" formControlName="direccion"
            class="w-full border border-gray-300 rounded-lg p-3">
        </div>

        <div>
          <label class="block mb-2 font-medium">Teléfono</label>
          <input type="tel" formControlName="telefono"
            class="w-full border border-gray-300 rounded-lg p-3">
        </div>

        <div>
          <label class="block mb-2 font-medium">Fecha</label>
          <input type="date" formControlName="fecha"
            class="w-full border border-gray-300 rounded-lg p-3">
        </div>

      </div>

      <h2 class="text-xl font-semibold mb-4">
        Seleccionar pizza
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <div>
          <label class="block mb-2 font-medium">Tamaño</label>

          <select formControlName="tamano"
            class="w-full border border-gray-300 rounded-lg p-3">
            <option value="Chica">Chica - $40</option>
            <option value="Mediana">Mediana - $80</option>
            <option value="Grande">Grande - $120</option>
          </select>
        </div>

        <div>
          <label class="block mb-2 font-medium">
            Ingredientes (+$10 c/u)
          </label>

          <div class="space-y-3">
            <label class="flex items-center gap-2">
              <input type="checkbox" formControlName="jamon">
              Jamón
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" formControlName="pina">
              Piña
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" formControlName="champinones">
              Champiñones
            </label>
          </div>
        </div>

        <div>
          <label class="block mb-2 font-medium">
            Número de pizzas
          </label>

          <input type="number" min="1" formControlName="cantidad"
            class="w-full border border-gray-300 rounded-lg p-3">
        </div>

      </div>

      <div class="mt-8">
        <button type="submit"
          class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-8 py-3 rounded-lg">
          Agregar pizza
        </button>
      </div>

    </form>

  </div>

</div>
